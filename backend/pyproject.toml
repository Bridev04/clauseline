[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clauseline"
version = "0.1.0"
description = "Contract intelligence with rigorous grounding, honest evals, and observable engineering."
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Validation & config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # LLM
    "anthropic>=0.34.0",

    # Embeddings
    "voyageai>=0.3.0",

    # Rerank
    "cohere>=5.9.0",

    # Agentic (deviation pipeline only)
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",

    # PDF parsing
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17",
    # LlamaParse fallback — uncomment when wiring in Week 1
    # "llama-parse>=0.5.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Observability
    "langfuse>=2.36.0",

    # Evals
    "ragas>=0.1.0",

    # HTTP / resilience
    "httpx>=0.27.0",
    "tenacity>=8.5.0",

    # Logging
    "structlog>=24.4.0",
    "rich>=13.9.0",

    # Utilities
    "pyyaml>=6.0.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM"]
ignore = [
    "E501",   # line-too-long handled by formatter
    "B008",   # FastAPI Depends() calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pymupdf4llm.*",
    "voyageai.*",
    "cohere.*",
    "langfuse.*",
    "ragas.*",
    "llama_parse.*",
    "fitz.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require live services (Postgres, APIs)",
    "eval: marks eval harness tests — run with --run-evals flag",
]
testpaths = ["tests"]
