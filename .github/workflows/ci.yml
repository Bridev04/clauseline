name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app

      - name: Test (pytest)
        run: uv run pytest --cov=app --cov-report=term-missing
        # NOTE: integration and eval tests are excluded by default.
        # - integration tests require a live Postgres instance (add a service container when needed)
        # - eval tests use the --run-evals flag and the eval gate; see ci_gate.py

      - name: Eval CI gate
        run: uv run python ../evals/scripts/ci_gate.py
        # Exits 0 (SKIP) until 3+ committed run files exist in evals/results/.
